name: Retrain repricer model (manual backup)
# The nightly retrain runs on the recorder itself (app.retrain, 3:17 AM Central). This workflow is only a manual backup;
# it uploads the new model only if it passes the same safety check against the recorder's current model.
on:
  workflow_dispatch: {}
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn requests
      - name: Train on the last 7 days; upload only if it beats the current model
        env:
          RECORDER_KEY: ${{ secrets.RECORDER_KEY }}
        run: python tools/train.py --days 7 --upload --out model.json
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: model.json
          retention-days: 30
